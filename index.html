<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1222">
  <title>最速乗換｜JR津田沼・太東</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="holidays.js"></script>
  <script defer src="timetable.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<main class="app">
  <header class="brand">
    <div class="brand-icon" aria-hidden="true">↗</div>
    <div><h1>最速乗換</h1><p>JR津田沼 ⇄ 太東</p></div>
  </header>

  <section class="panel search-panel" aria-label="時刻表データ">
    <div class="field">
      <label for="timetableFile">時刻表ファイル（JSON）</label>
      <input id="timetableFile" type="file" accept=".json,application/json">
    </div>
    <p id="dataStatus" class="hint" role="status">時刻表が未登録です。利用許諾のある時刻表ファイルを読み込むと検索できます。</p>
    <p id="sourceDetails" class="hint" hidden><a id="sourceLink" target="_blank" rel="noopener noreferrer"></a> <span id="sourceDates"></span></p>
    <p class="hint"><a href="https://timetables.jreast.co.jp/" target="_blank" rel="noopener noreferrer">JR東日本の公式時刻表</a> · <a href="https://traininfo.jreast.co.jp/train_info/kanto.aspx" target="_blank" rel="noopener noreferrer">運行情報</a></p>
    <noscript>検索にはJavaScriptが必要です。</noscript>
  </section>

  <form id="searchForm" class="panel search-panel">
    <div id="route" class="route-compact" aria-label="検索方向と乗換駅"></div>
    <div class="controls">
      <div class="field">
        <label for="direction">方向</label>
        <select id="direction" class="time-input">
          <option value="out">行き（太東へ）</option>
          <option value="back">帰り（津田沼へ）</option>
        </select>
      </div>
      <div class="field">
        <label for="mode">検索条件</label>
        <select id="mode" class="time-input">
          <option value="depart">この日時以降に出発</option>
          <option value="arrive">この日時までに到着</option>
        </select>
      </div>
      <div class="field">
        <label for="date">日付（日本時間）</label>
        <input id="date" class="time-input" type="date" required>
      </div>
      <div class="field">
        <label for="clock">時刻（日本時間）</label>
        <input id="clock" class="time-input" type="time" value="06:40" required>
      </div>
    </div>
    <div class="controls-secondary">
      <span id="transferSummary" class="hint"></span>
      <button id="settingsBtn" class="outline" type="button">乗換時間を設定</button>
      <button id="search" class="primary" type="submit" disabled>最速ルートを検索</button>
    </div>
  </form>
  <p id="queryStatus" class="summary" role="status" hidden></p>
  <section id="results" aria-labelledby="resultsHeading" hidden>
    <div class="results-heading"><h2 id="resultsHeading">検索結果</h2></div>
    <div class="result-grid">
      <article id="custom" class="panel result blue"></article>
      <article id="zero" class="panel result green"></article>
    </div>
    <p id="comparison" class="summary" aria-live="polite"></p>
  </section>
</main>

<dialog id="settingsDialog" class="modal" aria-labelledby="settingsHeading">
  <form id="settingsForm" method="dialog">
    <h2 id="settingsHeading">駅ごとの乗換時間</h2>
    <p>別の列車に移るまでに必要な時間を分単位で入力してください。</p>
    <div id="settingControls"></div>
    <div class="modal-buttons">
      <button id="resetBtn" class="outline" type="button">初期値に戻す</button>
      <button id="closeBtn" class="outline" type="button">閉じる</button>
      <button class="primary" type="submit">保存</button>
    </div>
  </form>
</dialog>
</body>
</html>
